server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json; gzip_min_length 512;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location ~* \.(woff2|webp|png|jpg|svg)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
