# Trading bot - freqtrade PAPER TRADING (dry_run) only. Never live.
# v2 (2026-10-23): ONE bot, BTC/USDT only = freqtrade-btc. Old A/B/C kept under profile 'old' (stopped).
# 2026-11-20: ALL crypto bots retired (user: crypto too hard). Moved to profile old, data kept. Focus = oil + gold.
# Old bots:
#   freqtrade      = TrendSimple (no Jev)      API http://127.0.0.1:8011
#   freqtrade-jev  = TrendSimpleJev (Jev gate) API http://127.0.0.1:8012
#   freqtrade-4h   = TrendSimple on 4h candles API http://127.0.0.1:8013
x-ft: &ft
  image: freqtradeorg/freqtrade:stable
  restart: unless-stopped
  mem_limit: 768m
  env_file: .env
  volumes:
    - ./user_data:/freqtrade/user_data
  networks:
    - default
    - n8n-stack_default

services:
  freqtrade:
    <<: *ft
    profiles: ["old"]
    container_name: freqtrade
    environment:
      # safety: force paper mode even if someone edits config.json
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "trendsimple-paper"
      JEV_URL: "http://jev-decision-server:8000"
    ports:
      - "127.0.0.1:8011:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy TrendSimple

  freqtrade-jev:
    <<: *ft
    profiles: ["old"]
    container_name: freqtrade-jev
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "trendsimple-jev-paper"
      JEV_URL: "http://jev-decision-server:8000"
      JEV_CACHE: "/freqtrade/user_data/jev_cache_live.json"
      JEV_MAX_CALLS: "200"
    ports:
      - "127.0.0.1:8012:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-jev.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun-jev.sqlite
      --config /freqtrade/user_data/config.json
      --strategy TrendSimpleJev

  # bot C (added 2026-10-23): same TrendSimple rules on 4h candles (experiment E5 candidate)
  freqtrade-4h:
    <<: *ft
    profiles: ["old"]
    container_name: freqtrade-4h
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "trendsimple-4h-paper"
      FREQTRADE__TIMEFRAME: "4h"
      TS_TF: "4h"
    ports:
      - "127.0.0.1:8013:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-4h.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun-4h.sqlite
      --config /freqtrade/user_data/config.json
      --strategy TrendSimple

  # bot D (v2, 2026-10-23): Binance TH prices, BTC/THB, 100000 THB fake. TrendSimple daily rules, FULL position (risk 1 -> stake capped 99%).
  # Backtest 2018-04..2026-10 fee 0.15%, --enable-protections, TS_PROT=light: +672%, DD 34% (mark-to-market). BTC hold ~+1111% / -77%. BORDERLINE vs gate. Design: Designs/2026-10-23-trading-bot-btc-focus.md
  freqtrade-btc:
    <<: *ft
    container_name: freqtrade-btc
    profiles: ["old"]
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "btc-thb-trend-paper"
      TS_TF: "1d"
      TS_RISK: "1"
      TS_MAX_STAKE: "0.99"
      TS_PROT: "light"
    ports:
      - "127.0.0.1:8014:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-btc.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun-th.sqlite
      --config /freqtrade/user_data/config_th.json
      --strategy TrendSimple

  # Shadow paper bots (2026-11-19): BTC/USDT:USDT Binance USDM perp, 1x isolated, 3000 USDT fake. Research: E_final.md (L1 post-hoc candidate, O1 control).
  freqtrade-btc-l1:
    <<: *ft
    container_name: freqtrade-btc-l1
    profiles: ["old"]
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "btc-fut-l1-shadow"
    ports:
      - "127.0.0.1:8015:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-btc-l1.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun-fut-l1.sqlite
      --config /freqtrade/user_data/config_fut_l1.json
      --strategy BtcTrendL1

  freqtrade-btc-o1:
    <<: *ft
    container_name: freqtrade-btc-o1
    profiles: ["old"]
    environment:
      FREQTRADE__DRY_RUN: "true"
      FREQTRADE__BOT_NAME: "btc-fut-o1-shadow"
    ports:
      - "127.0.0.1:8016:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade-btc-o1.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun-fut-o1.sqlite
      --config /freqtrade/user_data/config_fut_o1.json
      --strategy BtcTrendO1

  # Stocks + forex PAPER bots (no broker, no keys). Own engine: papertrader/ (freqtrade is crypto-only).
  # Picks from Projects/trading-bot/stocks-report.md + forex-report.md: both FAILED their gates -> test only (S3 near-miss; F3 clearly short on Sharpe/luck).
  papertrader-stocks:
    build: ./papertrader
    image: papertrader:latest
    container_name: papertrader-stocks
    restart: unless-stopped
    mem_limit: 512m
    environment:
      BOT: "stocks"
      STRATEGY: "S3 dual momentum"
      START_CASH: "3000"
      GATE: "FAILED gate - test only"
      RUN_AT: "08:00"
      TZ: "Asia/Bangkok"
    volumes:
      - ./papertrader/state:/app/state
  papertrader-forex:
    image: papertrader:latest
    container_name: papertrader-forex
    restart: unless-stopped
    mem_limit: 512m
    depends_on: [papertrader-stocks]
    environment:
      BOT: "forex"
      STRATEGY: "F3 12m momentum risk-sized"
      START_CASH: "3000"
      GATE: "FAILED gate - test only"
      RUN_AT: "08:05"
      TZ: "Asia/Bangkok"
    volumes:
      - ./papertrader/state:/app/state

networks:
  n8n-stack_default:
    external: true
