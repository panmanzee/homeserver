services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  newsfeed-api:
    build: ./newsfeed-api
    container_name: newsfeed-api
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/newsfeed
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      PROMPT_VERSION: ${PROMPT_VERSION:-v4}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-twelvedata}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DIGEST_MAX_ITEMS: ${DIGEST_MAX_ITEMS:-12}
      DIGEST_BULLETS_PER_ITEM: ${DIGEST_BULLETS_PER_ITEM:-2}
    ports:
      - "8001:8000"   # host access for manual testing / curl
    depends_on:
      - postgres

  taskbot:
    build: ./taskbot
    container_name: taskbot
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/taskbot
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # taskbot gets its own model knob: a per-message chat workload wants the
      # high free-tier RPD of a flash-lite model, independent of newsfeed's GEMINI_MODEL.
      GEMINI_MODEL: ${TASKBOT_GEMINI_MODEL:-gemini-3.1-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      TASKBOT_TZ: ${TASKBOT_TZ:-UTC}
      TASKBOT_MORNING_TIME: ${TASKBOT_MORNING_TIME:-07:30}
      TASKBOT_EVENING_TIME: ${TASKBOT_EVENING_TIME:-21:00}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
