! stands in for the VGW side, AS 64512
frr defaults traditional
hostname fake-vgw
!
ip route 10.50.0.0/16 Null0
ip prefix-list VPC-OUT seq 10 permit 10.50.0.0/16
ip prefix-list HOME-IN seq 10 permit 10.10.0.0/16
!
route-map TO-HOME permit 10
 match ip address prefix-list VPC-OUT
route-map FROM-HOME permit 10
 match ip address prefix-list HOME-IN
!
router bgp 64512
 bgp router-id 10.50.11.1
 no bgp ebgp-requires-policy
 neighbor 169.254.10.2 remote-as 65010
 neighbor 169.254.10.2 timers 10 30
 address-family ipv4 unicast
  network 10.50.0.0/16
  neighbor 169.254.10.2 route-map FROM-HOME in
  neighbor 169.254.10.2 route-map TO-HOME out
 exit-address-family
!
line vty
!
