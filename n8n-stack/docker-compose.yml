services:
  postgres:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  newsfeed-api:
    build: ./newsfeed-api
    container_name: newsfeed-api
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/newsfeed
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      PROMPT_VERSION: ${PROMPT_VERSION:-v4}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-twelvedata}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DIGEST_MAX_ITEMS: ${DIGEST_MAX_ITEMS:-12}
      DIGEST_BULLETS_PER_ITEM: ${DIGEST_BULLETS_PER_ITEM:-2}
    ports:
      - "127.0.0.1:8001:8000"   # web frontend + manual curl; reached via tailscale serve --https=8450
    depends_on:
      - postgres

  taskbot:
    build: ./taskbot
    container_name: taskbot
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/taskbot
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # taskbot gets its own model knob: a per-message chat workload wants the
      # high free-tier RPD of a flash-lite model, independent of newsfeed's GEMINI_MODEL.
      GEMINI_MODEL: ${TASKBOT_GEMINI_MODEL:-gemini-3.1-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5}
      TASKBOT_TZ: ${TASKBOT_TZ:-UTC}
      TASKBOT_MORNING_TIME: ${TASKBOT_MORNING_TIME:-07:30}
      TASKBOT_EVENING_TIME: ${TASKBOT_EVENING_TIME:-21:00}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      - postgres

  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    restart: always
    environment:
      # Public URL the vault is reached at — must match the tailscale serve host.
      DOMAIN: ${VAULTWARDEN_DOMAIN:?set VAULTWARDEN_DOMAIN in .env}
      # true only long enough to register the first account, then flip to false.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      # /admin panel stays disabled (no ADMIN_TOKEN) — one user doesn't need it.
    volumes:
      - vaultwarden_data:/data
    # localhost only: `tailscale serve` (https://<host>.ts.net → 127.0.0.1:8003)
    # is the sole way in. Never bound to the LAN or the internet.
    ports:
      - "127.0.0.1:8003:80"

  # Read-only, filtered view of the Docker socket so `homepage` can show
  # container status without mounting the real socket (which is root-on-host).
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: dockerproxy
    restart: always
    environment:
      CONTAINERS: 1      # list + inspect containers — all Homepage needs
      POST: 0            # deny every write (create/start/stop/exec/…)
      # everything else defaults to 0 (denied)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # no host port — Homepage reaches it as http://dockerproxy:2375 on the compose net

  # Homepage dashboard. Stateless — config is the YAML in ./homepage/config.
  # Bound to localhost; reached only via `tailscale serve --https=8443`.
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.2.0
    container_name: homepage
    restart: always
    environment:
      HOMEPAGE_ALLOWED_HOSTS: pan-homeserver.tail9ee4c5.ts.net:8443,pan-homeserver.tail9ee4c5.ts.net,localhost:8004,127.0.0.1:8004
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./homepage/config:/app/config
      - /:/host/root:ro          # read-only, for the disk-usage widget only
    ports:
      - "127.0.0.1:8004:3000"
    depends_on:
      - dockerproxy

  # RAG study Q&A over your own PDFs/notes. Corpus is mounted read-only;
  # chunks + embeddings live in the `rag` Postgres database. Bound to
  # localhost; reached from the tailnet via `tailscale serve --https=8444`.
  rag-api:
    build: ./rag-api
    container_name: rag-api
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/rag
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAG_GEN_MODEL: ${RAG_GEN_MODEL:-gemini-3.1-flash-lite}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-gemini-embedding-001}
      RAG_MAX_QUESTIONS_PER_DAY: ${RAG_MAX_QUESTIONS_PER_DAY:-200}
    volumes:
      - ./rag-api/corpus:/app/corpus:ro
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      - postgres

  # Uptime monitoring + alerting. Probes the other services (and external
  # sites) on a schedule and pushes a Telegram message on failure.
  # Bound to localhost; reached via `tailscale serve --https=8445`.
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    container_name: uptime-kuma
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:8006:3001"

  # Actual Budget — self-hosted envelope budgeting. Browser GUI, import bank
  # CSVs. SQLite data in the volume. Reached via `tailscale serve --https=8447`.
  actual:
    image: actualbudget/actual-server:26.9.0
    container_name: actual
    restart: always
    volumes:
      - actual_data:/data
    ports:
      - "127.0.0.1:8008:5006"

  # AdGuard Home — network-wide DNS ad/tracker blocking.
  # SAFETY: the DNS listener binds ONLY to the Tailscale interface IP
  # (100.77.47.51). The box's own resolver, /etc/resolv.conf, and the router
  # are never touched. A device opts in by pointing its DNS at 100.77.47.51
  # (must be on the tailnet) and can revert to automatic at any time.
  # Web UI via `tailscale serve --https=8446`.
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard
    restart: always
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    ports:
      - "100.77.47.51:53:53/tcp"   # DNS — Tailscale interface ONLY
      - "100.77.47.51:53:53/udp"
      - "127.0.0.1:8007:3000"      # admin UI (set web port = 3000 in the setup wizard)

  # KanjiDojo — personal kanji study app (github.com/panmanzee/learn-kanji).
  # FastAPI serves the static frontend + a small JSON API; state lives in the
  # shared Postgres (own `kanjidojo` database, same one-DB-per-service
  # pattern as the rest of the stack) — no separate volume needed.
  # Build context is a sibling checkout, not this repo (it's the user's own
  # standalone project, kept independently versioned on GitHub).
  kanjidojo:
    build: ../../learn-kanji
    container_name: kanjidojo
    restart: always
    environment:
      DATABASE_URL: postgresql://n8n:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/kanjidojo
    ports:
      - "127.0.0.1:8009:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
  vaultwarden_data:
  uptime_kuma_data:
  actual_data:
  adguard_work:
  adguard_conf:
