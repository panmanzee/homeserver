server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 256k;
  gzip on; gzip_types text/css application/javascript image/svg+xml application/json; gzip_min_length 512;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Cloudflare -> tunnel -> Traefik -> here. add_header in a location replaces the server-level ones, so every location includes the same file.
  location /api/ {
    set $api http://astravel-api:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    include /etc/nginx/conf.d/security.inc;
    add_header Cache-Control "no-store" always;
  }
  location = /healthz { return 200 "ok"; default_type text/plain; }
  location ^~ /v/ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/conf.d/security.inc; try_files $uri =404; }
  location ~* \.(woff2|webp|png|jpg|svg)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; include /etc/nginx/conf.d/security.inc; }
  location ~* \.(js|css)$ { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security.inc; }
  location / { add_header Cache-Control "no-cache"; include /etc/nginx/conf.d/security.inc; try_files $uri /index.html; }
}
